# Ansible インベントリ（管理対象サーバーの一覧）
# [グループ名] の下にホストを書きます

[webservers]
# target1: Mac の localhost:2221 経由で SSH 接続
# greeting_message: このホスト専用の HTML 文言（playbook で index.html に使う）
target1 ansible_host=127.0.0.1 ansible_port=2221 ansible_user=ansible greeting_message="Hello from target1"

# target2: Mac の localhost:2222 経由で SSH 接続
target2 ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible greeting_message="Hello from target2"

[webservers:vars]
# SSH 接続時の共通設定
ansible_ssh_pass=ansible
ansible_become_pass=ansible
ansible_python_interpreter=/usr/bin/python3

# 初回接続時のホスト鍵確認をスキップ（練習環境用）
# 本番環境では StrictHostKeyChecking を有効にしてください
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
