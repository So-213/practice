# Nginx リバースプロキシ設定
# reverse-proxy コンテナから target1 / target2 の Python HTTP サーバーへ振り分けます

events {
    worker_connections 1024;
}

http {
    # ロードバランシング先（Docker Compose のサービス名で名前解決）
    upstream app_servers {
        server target1:8000;
        server target2:8000;
    }

    server {
        listen 80;

        location / {
            # upstream app_servers へリクエストを転送
            proxy_pass http://app_servers;

            # バックエンドに元のリクエスト情報を渡す（最低限のヘッダー）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
