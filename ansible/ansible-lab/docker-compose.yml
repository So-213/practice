# Ansible 練習環境
# target1 / target2 の 2 台の Ubuntu コンテナと、Nginx リバースプロキシを起動します
# Mac 上の Ansible（コントロールノード）から SSH 経由で操作する想定です

services:
  # 1 台目のターゲットサーバー（localhost:2221 で SSH 接続）
  target1:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: target1
    hostname: target1
    ports:
      - "2221:22"
    networks:
      - ansible-lab

  # 2 台目のターゲットサーバー（localhost:2222 で SSH 接続）
  target2:
    build:
      context: .
      dockerfile: Dockerfile.target
    container_name: target2
    hostname: target2
    ports:
      - "2222:22"
    networks:
      - ansible-lab

  # Nginx リバースプロキシ（Mac の localhost:8080 → target1/target2:8000）
  reverse-proxy:
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - target1
      - target2
    networks:
      - ansible-lab

networks:
  ansible-lab:
    driver: bridge
